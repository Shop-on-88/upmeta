<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>UP META 카카오톡 상담</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  /* 레이아웃: 왼쪽 정렬 한 화면 — 큰 제목, 노란 상담 버튼 하나, 그 아래 3단계 안내 */
  :root {
    --bg: #f4f2ec;
    --surface: #ffffff;
    --ink: #1c1a14;
    --muted: #6b665a;
    --line: #e2ded2;
    --talk: #fee500;        /* 상담 버튼 노랑 */
    --talk-ink: #191600;
    --font-display: "Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    --font-body: "Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #15140f;
      --surface: #201e17;
      --ink: #f5f2e6;
      --muted: #a8a290;
      --line: #35322a;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #15140f;
    --surface: #201e17;
    --ink: #f5f2e6;
    --muted: #a8a290;
    --line: #35322a;
    color-scheme: dark;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: var(--font-body);
    font-size: 16px;
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
  }
  main {
    max-width: 520px;
    margin: 0 auto;
    padding: 48px 20px 40px;
    display: flex;
    flex-direction: column;
    gap: 28px;
  }

  .badge {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    align-self: flex-start;
    padding: 6px 12px;
    border: 1px solid var(--line);
    border-radius: 999px;
    background: var(--surface);
    font-size: 13px;
    font-weight: 500;
    color: var(--muted);
  }
  .badge i {
    width: 8px; height: 8px; border-radius: 50%;
    background: var(--talk);
    box-shadow: 0 0 0 3px color-mix(in srgb, var(--talk) 35%, transparent);
  }

  h1 {
    margin: 0;
    font-family: var(--font-display);
    font-weight: 900;
    font-size: clamp(30px, 8.4vw, 42px);
    line-height: 1.22;
    letter-spacing: -0.03em;
    text-wrap: balance;
  }
  h1 mark {
    background: linear-gradient(transparent 62%, var(--talk) 62%);
    color: inherit;
    padding: 0 2px;
  }
  .lead {
    margin: 0;
    color: var(--muted);
    font-size: 16px;
  }

  .cta {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    min-height: 62px;
    padding: 16px 20px;
    border-radius: 16px;
    background: var(--talk);
    color: var(--talk-ink);
    font-size: 18px;
    font-weight: 700;
    text-decoration: none;
    box-shadow: 0 10px 24px -12px rgba(120, 100, 0, .55);
    transition: transform .15s ease, box-shadow .15s ease;
  }
  .cta:hover { transform: translateY(-2px); box-shadow: 0 14px 28px -12px rgba(120, 100, 0, .6); }
  .cta:active { transform: translateY(0); }
  .cta:focus-visible, .copy:focus-visible { outline: 3px solid var(--ink); outline-offset: 3px; }
  .cta svg { width: 26px; height: 26px; flex: none; }

  .steps {
    list-style: none;
    margin: 0;
    padding: 0;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 16px;
  }
  .steps li {
    display: flex;
    gap: 14px;
    align-items: baseline;
    padding: 16px 18px;
  }
  .steps li + li { border-top: 1px solid var(--line); }
  .steps b {
    flex: none;
    font-weight: 900;
    font-size: 15px;
    font-variant-numeric: tabular-nums;
    color: var(--muted);
  }
  .steps span { font-weight: 500; }

  .linkrow {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 10px;
    font-size: 14px;
    color: var(--muted);
  }
  .linkrow code {
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    font-size: 13px;
    color: var(--ink);
    overflow-wrap: anywhere;
  }
  .copy {
    border: 1px solid var(--line);
    background: var(--surface);
    color: var(--ink);
    font: inherit;
    font-size: 13px;
    font-weight: 500;
    padding: 6px 12px;
    border-radius: 999px;
    cursor: pointer;
  }

  @media (prefers-reduced-motion: reduce) {
    .cta { transition: none; }
    .cta:hover { transform: none; }
  }
</style>
</head>
<body>
<main>
  <div class="badge"><i></i>UP META · 카카오톡 1:1 상담</div>

  <h1>궁금한 점,<br><mark>카카오톡</mark>으로<br>바로 물어보세요</h1>

  <p class="lead">아래 버튼을 누르면 카카오톡 오픈채팅방으로 바로 연결됩니다.</p>

  <a class="cta" href="https://open.kakao.com/o/si47cfUi" target="_blank" rel="noopener">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12 3.5c-5.1 0-9.2 3.2-9.2 7.2 0 2.5 1.7 4.800 4.2 6.100l-.9 3.300c-.1.400.300.700.700.500l3.900-2.600c.4 0 .9.1 1.300.1 5.100 0 9.200-3.300 9.200-7.300S17.100 3.500 12 3.500z"/></svg>
    카카오톡에서 상담받기
  </a>

  <ol class="steps">
    <li><b>01</b><span>위의 노란 버튼을 누릅니다</span></li>
    <li><b>02</b><span>카카오톡 오픈채팅방에 입장합니다</span></li>
    <li><b>03</b><span>문의 내용을 남기면 답변드립니다</span></li>
  </ol>

  <div class="linkrow">
    <span>버튼이 안 열리면</span>
    <code id="link">https://open.kakao.com/o/si47cfUi</code>
    <button class="copy" id="copy" type="button">주소 복사</button>
  </div>
</main>

<script>
  document.getElementById('copy').addEventListener('click', function () {
    var btn = this;
    var url = document.getElementById('link').textContent;
    navigator.clipboard.writeText(url).then(function () {
      btn.textContent = '복사됨';
      setTimeout(function () { btn.textContent = '주소 복사'; }, 1600);
    }).catch(function () {
      btn.textContent = '주소를 길게 눌러 복사하세요';
    });
  });
</script>
</body>
</html>
