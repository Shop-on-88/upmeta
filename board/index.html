<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0b0d12">
<title>UP META 업무 보드</title>
<style>
:root{--bg:#0b0d12;--card:#151922;--card2:#1c212c;--line:#272d3a;--tx:#eef1f6;--mu:#8b93a5;--ac:#4f8cff;
--new:#ff5d5d;--ack:#b08cff;--doing:#4f8cff;--hold:#f5b73d;--stop:#8b93a5;--done:#3ecf8e}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 -apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
.wrap{max-width:760px;margin:0 auto;padding:0 14px 110px}
header{position:sticky;top:0;z-index:5;background:rgba(11,13,18,.92);backdrop-filter:blur(10px);padding:14px 0 8px}
.top{display:flex;align-items:center;gap:10px}
.logo{font-weight:800;font-size:18px;letter-spacing:-.3px}.logo b{color:var(--ac)}
.live{font-size:11px;color:var(--done);display:flex;align-items:center;gap:5px}
.live i{width:7px;height:7px;border-radius:50%;background:var(--done);box-shadow:0 0 8px var(--done)}
.live.off{color:var(--mu)}.live.off i{background:var(--mu);box-shadow:none}
.sp{flex:1}
.who{font-size:13px;color:var(--mu);padding:6px 10px;border:1px solid var(--line);border-radius:99px}
.stats{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;margin:12px 0 8px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px 2px;text-align:center}
.stat.on{border-color:var(--c);background:var(--card2)}
.stat b{display:block;font-size:19px;color:var(--c);line-height:1.2}.stat span{font-size:11px;color:var(--mu)}
.filters{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.chip{white-space:nowrap;padding:6px 12px;border-radius:99px;border:1px solid var(--line);font-size:13px;color:var(--mu);background:var(--card)}
.chip.on{background:var(--ac);border-color:var(--ac);color:#fff;font-weight:600}
.task{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--c);border-radius:14px;padding:13px 14px;margin-top:10px;cursor:pointer}
.task:active{background:var(--card2)}
.row{display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.badge{font-size:12px;font-weight:700;padding:2px 9px;border-radius:99px;color:var(--c);background:color-mix(in srgb,var(--c) 16%,transparent)}
.tag{font-size:12px;color:var(--mu)}.tag.hot{color:var(--new);font-weight:700}.tag.late{color:var(--new)}
.ttl{font-size:16px;font-weight:650;margin:7px 0 3px;word-break:break-word}
.note{font-size:13px;color:var(--mu);background:var(--card2);border-radius:9px;padding:7px 10px;margin-top:8px;word-break:break-word}
.note b{color:var(--tx);font-weight:600}
.empty{text-align:center;color:var(--mu);padding:60px 0}
.fab{position:fixed;right:18px;bottom:22px;background:var(--ac);color:#fff;font-weight:700;padding:14px 20px;border-radius:99px;box-shadow:0 8px 24px rgba(79,140,255,.4);z-index:6}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:10;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--card);width:100%;max-width:760px;max-height:92vh;overflow-y:auto;border-radius:20px 20px 0 0;padding:18px 16px 28px;border:1px solid var(--line)}
@media(min-width:700px){.ov{align-items:center}.sheet{border-radius:20px}}
.sheet h2{margin:0 0 12px;font-size:18px;display:flex;align-items:center;gap:8px}
.x{margin-left:auto;font-size:22px;color:var(--mu);padding:0 6px}
label{display:block;font-size:12px;color:var(--mu);margin:12px 0 5px}
input,select,textarea{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:11px 12px;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--ac)}
textarea{min-height:76px;resize:vertical}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn{width:100%;background:var(--ac);color:#fff;font-weight:700;padding:13px;border-radius:12px;margin-top:16px}
.btn.gh{background:var(--card2);color:var(--tx);border:1px solid var(--line)}
.btn.dg{background:none;color:var(--new);border:1px solid var(--line)}
.sts{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}
.st{padding:11px 4px;border-radius:11px;border:1px solid var(--line);background:var(--bg);font-weight:600;font-size:14px;color:var(--c)}
.st.on{background:var(--c);color:#0b0d12;border-color:var(--c)}
.detail{white-space:pre-wrap;word-break:break-word;color:#cfd5e1;font-size:14px;margin:6px 0}
.log{display:flex;gap:10px;padding:9px 0;border-top:1px solid var(--line);font-size:13px}
.log time{color:var(--mu);white-space:nowrap;font-size:12px;min-width:74px}
.log div{word-break:break-word}.log b{font-weight:600}
.msg{color:var(--new);font-size:13px;min-height:18px;margin-top:8px}
.login{max-width:380px;margin:14vh auto 0;padding:0 18px}
.login h1{font-size:26px;margin:0 0 4px}.login p{color:var(--mu);margin:0 0 20px}
.urow{display:flex;align-items:center;gap:8px;padding:10px 0;border-top:1px solid var(--line)}
.urow button{white-space:nowrap;font-size:13px;color:var(--mu);border:1px solid var(--line);border-radius:8px;padding:4px 9px}
.due{width:100%;text-align:left;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:11px 12px;color:var(--mu)}
.due.set{color:var(--tx)}
#cal{background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:10px;margin-top:8px}
.calh{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}.calh button{font-size:22px;width:44px;height:36px;color:var(--tx)}
.calg{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;text-align:center}
.calg span{font-size:12px;color:var(--mu);padding:4px 0}.calg button{height:40px;border-radius:9px;font-size:14px}
.calg button:hover{background:var(--card2)}.calg .sun{color:#ff7b7b}.calg .sat{color:#6aa5ff}
.calg .tod{border:1px solid var(--ac)}.calg .sel{background:var(--ac);color:#fff;font-weight:700}
.calf{display:flex;gap:8px;margin-top:8px}.calf button{flex:1;padding:9px;border-radius:9px;border:1px solid var(--line);font-size:13px;color:var(--tx)}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:#fff;color:#111;padding:10px 16px;border-radius:99px;font-size:13px;font-weight:600;z-index:20}
</style>
</head>
<body>
<div id="app"></div>
<script>
const ST={new:'미확인',ack:'확인',doing:'진행 중',hold:'보류',stop:'중지',done:'완료'};
const NEED={hold:'보류 사유',stop:'중지 사유',done:'완료 내용 (어떻게 완료했는지)'};
const PR={high:'긴급',normal:'보통',low:'낮음'};
const RL={admin:'관리자',lead:'팀장',staff:'직원'};
const JOIN=new URLSearchParams(location.search).get('join')||'';
let S=null,filter='open',who='all',modal=null,es=null,live=false;
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const today=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const fmt=ts=>{const d=new Date(ts*1000);return (d.getMonth()+1)+'/'+d.getDate()+' '+String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')};
const uname=id=>(S.users.find(u=>u.id===id)||{}).name||'미지정';
const staff=()=>S.users.filter(u=>u.active);
async function api(path,data){
  const r=await fetch(path,data?{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)}:{});
  const j=await r.json().catch(()=>({error:'서버 응답 오류'}));
  if(!r.ok)throw new Error(j.error||'오류가 발생했습니다');
  return j;
}
function toast(t){const e=document.createElement('div');e.className='toast';e.textContent=t;document.body.append(e);setTimeout(()=>e.remove(),2200)}
async function load(){
  try{S=await api('/api/state'+(JOIN?'?join='+encodeURIComponent(JOIN):''))}catch(e){return}
  if(S.me&&!es)connect();
  render();
}
function connect(){
  es=new EventSource('/api/events');
  es.onopen=()=>{live=true;load()};
  es.onmessage=()=>load();
  es.onerror=()=>{live=false;const l=$('.live');if(l){l.classList.add('off');l.lastChild.textContent='연결 중…'}};
}
function render(){
  const app=$('#app');
  if(!S.me){app.innerHTML=loginView();return}
  // 열려 있는 입력창을 건드리지 않도록, 모달이 떠 있으면 목록만 갱신
  let main=$('#main');
  if(!main){app.innerHTML='<div class="wrap" id="main"></div><button class="fab" onclick="openNew()">＋ 업무 지시</button><div id="mod"></div>';main=$('#main')}
  main.innerHTML=boardView();
  if(modal&&modal.type==='task'&&!$('#mod textarea:focus, #mod input:focus')){
    S.tasks.some(t=>t.id===modal.id)?showModal():closeModal();
  }
}
function loginView(){
  const setup=S.setup;
  if(JOIN&&(S.join||!setup))return S.join?`<div class="login"><h1>UP META <span style="color:var(--ac)">업무 보드</span></h1>
  <p>가입 직책: <b style="color:var(--tx)">${RL[S.join.role]}</b> — 사용할 이름과 비밀번호를 정해 주세요.</p>
  <form onsubmit="doJoin(event)"><label>이름</label><input id="ln" autocomplete="username" required maxlength="30">
  <label>비밀번호 (4자 이상)</label><input id="lp" type="password" autocomplete="new-password" required minlength="4">
  <button class="btn">가입하기</button><div class="msg" id="lm"></div></form>
  <p style="margin-top:18px;font-size:13px">이미 가입했다면 <a href="/" style="color:var(--ac)">로그인</a></p></div>`
  :`<div class="login"><h1>UP META <span style="color:var(--ac)">업무 보드</span></h1><p>가입 링크가 만료되었거나 잘못되었습니다.<br>관리자에게 새 링크를 받아 주세요.</p><a class="btn" style="display:block;text-align:center;text-decoration:none" href="/">로그인 화면으로</a></div>`;
  return `<div class="login"><h1>UP META <span style="color:var(--ac)">업무 보드</span></h1>
  <p>${setup?'처음 사용입니다. 사장님(관리자) 계정을 만들어 주세요.':'이름과 비밀번호로 들어오세요.'}</p>
  <form onsubmit="doLogin(event,${setup})"><label>이름</label><input id="ln" autocomplete="username" required>
  <label>비밀번호 ${setup?'(4자 이상)':''}</label><input id="lp" type="password" autocomplete="${setup?'new-password':'current-password'}" required minlength="4">
  ${setup?'<label>설정 코드 (텔레그램으로 받은 숫자 6자리)</label><input id="lc" inputmode="numeric" autocomplete="one-time-code" required>':''}
  <button class="btn">${setup?'관리자 계정 만들기':'들어가기'}</button><div class="msg" id="lm"></div></form></div>`;
}
async function doLogin(e,setup){
  e.preventDefault();
  try{await api(setup?'/api/setup':'/api/login',{name:$('#ln').value,pin:$('#lp').value,code:setup?$('#lc').value:undefined});await load()}
  catch(x){$('#lm').textContent=x.message}
}
async function doJoin(e){
  e.preventDefault();
  try{await api('/api/join',{token:JOIN,name:$('#ln').value,pin:$('#lp').value});location.replace('/')}
  catch(x){$('#lm').textContent=x.message}
}
function boardView(){
  const T=S.tasks,cnt=k=>T.filter(t=>t.status===k).length;
  let list=T.filter(t=>filter==='all'?true:filter==='open'?!['done','stop'].includes(t.status):t.status===filter);
  if(who==='me')list=list.filter(t=>t.assignee_id===S.me.id);
  else if(who!=='all')list=list.filter(t=>t.assignee_id===who);
  const rank={new:0,ack:1,doing:2,hold:3,stop:4,done:5},pr={high:0,normal:1,low:2};
  list.sort((a,b)=>rank[a.status]-rank[b.status]||pr[a.priority]-pr[b.priority]||(a.due||'9').localeCompare(b.due||'9')||b.updated-a.updated);
  const td=today();
  return `<header><div class="top"><div class="logo"><b>UP META</b> 업무 보드</div>
  <div class="live ${live?'':'off'}"><i></i><span>${live?'실시간':'연결 중…'}</span></div><div class="sp"></div>
  <button class="who" onclick="openMenu()">${esc(S.me.name)} ▾</button></div>
  <div class="stats">${Object.keys(ST).map(k=>`<button class="stat ${filter===k?'on':''}" style="--c:var(--${k})" onclick="setF('${k}')"><b>${cnt(k)}</b><span>${ST[k]}</span></button>`).join('')}</div>
  <div class="filters"><button class="chip ${filter==='open'?'on':''}" onclick="setF('open')">미완료 전체</button>
  <button class="chip ${filter==='all'?'on':''}" onclick="setF('all')">전체</button>
  <span style="width:1px;background:var(--line);margin:4px 2px"></span>
  <button class="chip ${who==='all'?'on':''}" onclick="setW('all')">모든 담당자</button>
  <button class="chip ${who==='me'?'on':''}" onclick="setW('me')">내 업무</button>
  ${staff().filter(u=>u.id!==S.me.id).map(u=>`<button class="chip ${who===u.id?'on':''}" onclick="setW(${u.id})">${esc(u.name)}</button>`).join('')}</div></header>
  ${list.length?list.map(t=>{const last=t.logs.find(l=>l.kind==='note');const late=t.due&&t.due<td&&!['done','stop'].includes(t.status);
    return `<div class="task" style="--c:var(--${t.status})" onclick="openTask(${t.id})">
    <div class="row"><span class="badge">${ST[t.status]}</span>${t.priority==='high'?'<span class="tag hot">🔥 긴급</span>':''}
    <span class="tag">👤 ${esc(uname(t.assignee_id))}</span>${t.due?`<span class="tag ${late?'late':''}">📅 ${t.due.slice(5).replace('-','/')}${late?' 기한 지남':''}</span>`:''}
    <span class="sp"></span><span class="tag">${fmt(t.updated)}</span></div>
    <div class="ttl">${esc(t.title)}</div>
    ${t.status_note?`<div class="note"><b>${ST[t.status]}:</b> ${esc(t.status_note)}</div>`:''}
    ${last?`<div class="note"><b>특이사항 · ${esc(uname(last.user_id))}:</b> ${esc(last.text)}</div>`:''}</div>`}).join('')
  :'<div class="empty">해당하는 업무가 없습니다</div>'}`;
}
function setF(f){filter=filter===f&&f!=='open'&&f!=='all'?'open':f;render()}
function setW(w){who=w;render()}
function closeModal(){modal=null;$('#mod').innerHTML=''}
function showModal(){
  const m=$('#mod');let h='';
  if(modal.type==='new'||modal.type==='edit')h=formView();
  else if(modal.type==='task')h=taskView();
  else if(modal.type==='menu')h=menuView();
  m.innerHTML=`<div class="ov" onclick="if(event.target===this)closeModal()"><div class="sheet">${h}</div></div>`;
  dueLabel();
}
function openNew(){modal={type:'new'};showModal();$('#ft').focus()}
const WD=['일','월','화','수','목','금','토'];let calYM=null;
function dueLabel(){const b=$('#dueb');if(!b)return;const v=$('#fdue').value;
  if(v){const d=new Date(v+'T00:00:00');b.innerHTML='📅 '+d.getFullYear()+'년 '+(d.getMonth()+1)+'월 '+d.getDate()+'일 ('+WD[d.getDay()]+')';b.classList.add('set')}
  else{b.innerHTML='📅 날짜 선택 (기한 없음)';b.classList.remove('set')}}
function calToggle(){const c=$('#cal');if(!c.hidden){c.hidden=true;return}
  const v=$('#fdue').value||today();calYM=[+v.slice(0,4),+v.slice(5,7)-1];c.hidden=false;calDraw()}
function calMove(n){const d=new Date(calYM[0],calYM[1]+n,1);calYM=[d.getFullYear(),d.getMonth()];calDraw()}
function calPick(v){$('#fdue').value=v;$('#cal').hidden=true;dueLabel()}
function calDraw(){const [y,m]=calYM,first=new Date(y,m,1).getDay(),days=new Date(y,m+1,0).getDate(),sel=$('#fdue').value,td=today();
  let h=`<div class="calh"><button type="button" onclick="calMove(-1)">‹</button><b>${y}년 ${m+1}월</b><button type="button" onclick="calMove(1)">›</button></div><div class="calg">`
   +WD.map((w,i)=>`<span class="${i===0?'sun':i===6?'sat':''}">${w}</span>`).join('')+'<i></i>'.repeat(first);
  for(let d=1;d<=days;d++){const v=y+'-'+String(m+1).padStart(2,'0')+'-'+String(d).padStart(2,'0'),w=(first+d-1)%7;
    h+=`<button type="button" class="${v===sel?'sel ':''}${v===td?'tod ':''}${w===0?'sun':w===6?'sat':''}" onclick="calPick('${v}')">${d}</button>`}
  h+=`</div><div class="calf"><button type="button" onclick="calPick('${td}')">오늘</button><button type="button" onclick="calPick('')">기한 없음</button></div>`;
  $('#cal').innerHTML=h}
function openTask(id){modal={type:'task',id,pick:null};showModal()}
function openMenu(){modal={type:'menu'};showModal()}
function formView(){
  const t=modal.type==='edit'?S.tasks.find(x=>x.id===modal.id):{priority:'normal',assignee_id:null};
  return `<h2>${modal.type==='edit'?'업무 수정':'업무 지시 등록'}<button class="x" onclick="closeModal()">×</button></h2>
  <form onsubmit="saveTask(event)"><label>업무 제목</label><input id="ft" required maxlength="200" value="${esc(t.title)}">
  <label>상세 내용</label><textarea id="fd" placeholder="무엇을, 어떻게, 언제까지">${esc(t.detail)}</textarea>
  <div class="g2"><div><label>담당자</label><select id="fa"><option value="">미지정</option>${staff().map(u=>`<option value="${u.id}" ${u.id===t.assignee_id?'selected':''}>${esc(u.name)}</option>`).join('')}</select></div>
  <div><label>중요도</label><select id="fp">${Object.keys(PR).map(k=>`<option value="${k}" ${k===t.priority?'selected':''}>${PR[k]}</option>`).join('')}</select></div></div>
  <label>기한</label><input id="fdue" type="hidden" value="${esc(t.due)}">
  <button type="button" class="due" id="dueb" onclick="calToggle()"></button><div id="cal" hidden></div>
  <button class="btn">${modal.type==='edit'?'수정 저장':'지시 등록'}</button><div class="msg" id="fm"></div></form>`;
}
async function saveTask(e){
  e.preventDefault();
  const d={title:$('#ft').value,detail:$('#fd').value,assignee_id:$('#fa').value?+$('#fa').value:null,priority:$('#fp').value,due:$('#fdue').value};
  try{
    if(modal.type==='edit'){const id=modal.id;await api('/api/tasks/'+id,d);modal={type:'task',id,pick:null};await load();showModal()}
    else{await api('/api/tasks',d);closeModal();toast('지시가 등록되었습니다');load()}
  }catch(x){$('#fm').textContent=x.message}
}
function taskView(){
  const t=S.tasks.find(x=>x.id===modal.id);if(!t)return'';
  const canDel=S.me.role!=='staff'||t.creator_id===S.me.id,p=modal.pick;
  return `<h2><span class="badge" style="--c:var(--${t.status})">${ST[t.status]}</span>${t.priority==='high'?'<span class="tag hot">🔥 긴급</span>':''}<button class="x" onclick="closeModal()">×</button></h2>
  <div class="ttl" style="font-size:19px;margin-top:0">${esc(t.title)}</div>
  <div class="row"><span class="tag">👤 담당 ${esc(uname(t.assignee_id))}</span><span class="tag">✍️ 지시 ${esc(uname(t.creator_id))}</span>${t.due?`<span class="tag">📅 ${t.due}</span>`:''}</div>
  ${t.detail?`<div class="detail">${esc(t.detail)}</div>`:''}
  ${t.status_note?`<div class="note"><b>${ST[t.status]}:</b> ${esc(t.status_note)}</div>`:''}
  <label>상태 변경</label><div class="sts">${Object.keys(ST).map(k=>`<button class="st ${(p||t.status)===k?'on':''}" style="--c:var(--${k})" onclick="pickSt('${k}')">${ST[k]}</button>`).join('')}</div>
  ${p&&p!==t.status?`<label>${NEED[p]||'메모 (선택)'}</label><textarea id="sn" placeholder="${NEED[p]?'반드시 적어 주세요':''}"></textarea>
  <button class="btn" onclick="saveSt()">「${ST[p]}」(으)로 변경</button>`:''}
  <div class="msg" id="tm"></div>
  <label>특이사항 추가</label><textarea id="nt" placeholder="공유할 특이사항, 진행 상황"></textarea>
  <button class="btn gh" style="margin-top:8px" onclick="addNote()">특이사항 올리기</button>
  <div class="g2"><button class="btn gh" onclick="modal={type:'edit',id:${t.id}};showModal()">수정</button>
  ${canDel?`<button class="btn dg" id="del" onclick="delTask(this)">삭제</button>`:'<span></span>'}</div>
  <label>기록</label>${t.logs.map(l=>`<div class="log"><time>${fmt(l.created)}</time><div><b>${esc(uname(l.user_id))}</b> ${esc(l.text)}</div></div>`).join('')}`;
}
function pickSt(k){modal.pick=k;showModal();const s=$('#sn');if(s)s.focus()}
async function saveSt(){
  try{await api('/api/tasks/'+modal.id,{status:modal.pick,note:$('#sn').value});modal.pick=null;await load();showModal();toast('상태가 변경되었습니다')}
  catch(x){$('#tm').textContent=x.message}
}
async function addNote(){
  try{await api('/api/tasks/'+modal.id+'/log',{text:$('#nt').value});await load();showModal();toast('특이사항이 공유되었습니다')}
  catch(x){$('#tm').textContent=x.message}
}
async function delTask(b){
  if(b.dataset.sure!=='1'){b.dataset.sure='1';b.textContent='한 번 더 누르면 삭제';return}
  try{await api('/api/tasks/'+modal.id+'/delete',{});closeModal();toast('삭제되었습니다');load()}catch(x){$('#tm').textContent=x.message}
}
function menuView(){
  const admin=S.me.role==='admin';
  return `<h2>${esc(S.me.name)} <span class="tag">${RL[S.me.role]}</span><button class="x" onclick="closeModal()">×</button></h2>
  ${admin?`<label>가입 링크 (받은 사람이 이름·비밀번호를 직접 정해 가입, 7일간 유효)</label>
  <div class="sts">${Object.keys(RL).map(k=>`<button class="st" style="--c:var(--tx)" onclick="mkInvite('${k}')">${RL[k]} 링크</button>`).join('')}</div>
  ${(S.invites||[]).map(v=>`<div class="urow"><span class="tag" style="min-width:42px">${RL[v.role]}</span><input readonly value="${location.origin}/?join=${esc(v.token)}" onclick="this.select()" style="padding:7px 9px;font-size:12px">
  <button onclick="copyInv(this)">복사</button><button onclick="rmInvite('${esc(v.token)}')">삭제</button></div>`).join('')}
  <label>구성원</label>${S.users.filter(u=>u.active).map(u=>`<div class="urow"><b>${esc(u.name)}</b><span class="sp"></span>
  ${u.id!==S.me.id?`<select style="width:auto;padding:4px 6px;font-size:13px" onchange="setRole(${u.id},this.value)">${Object.keys(RL).map(k=>`<option value="${k}" ${k===u.role?'selected':''}>${RL[k]}</option>`).join('')}</select>`:`<span class="tag">${RL[u.role]}</span>`}
  <button onclick="resetPin(${u.id})">비밀번호</button>${u.id!==S.me.id?`<button onclick="delUser(this,${u.id})">삭제</button>`:''}</div>`).join('')}
  <label>직접 추가</label><div class="g2"><input id="un" placeholder="이름"><input id="up" type="password" placeholder="비밀번호 (4자 이상)" autocomplete="new-password"></div>
  <select id="ur" style="margin-top:8px"><option value="staff">직원</option><option value="lead">팀장</option><option value="admin">관리자</option></select>
  <button class="btn gh" style="margin-top:8px" onclick="addUser()">추가</button>`
  :`<button class="btn gh" onclick="resetPin(${S.me.id})">내 비밀번호 변경</button>`}
  <div id="pinbox"></div><div class="msg" id="mm"></div>
  <button class="btn dg" onclick="logout()">로그아웃</button>`;
}
async function mkInvite(role){
  try{await api('/api/invites',{role});await load();showModal();toast(RL[role]+' 가입 링크를 만들었습니다')}catch(x){$('#mm').textContent=x.message}
}
async function rmInvite(token){
  try{await api('/api/invites/delete',{token});await load();showModal()}catch(x){$('#mm').textContent=x.message}
}
function copyInv(b){
  const i=b.previousElementSibling;i.select();
  try{navigator.clipboard.writeText(i.value).then(()=>toast('복사되었습니다'),()=>document.execCommand('copy'))}catch(e){document.execCommand('copy')}
}
async function setRole(id,role){
  try{await api('/api/users/'+id+'/role',{role});await load();showModal();toast('직책이 변경되었습니다')}catch(x){$('#mm').textContent=x.message}
}
async function addUser(){
  try{await api('/api/users',{name:$('#un').value,pin:$('#up').value,role:$('#ur').value});await load();showModal();toast('추가되었습니다')}
  catch(x){$('#mm').textContent=x.message}
}
function resetPin(id){
  $('#pinbox').innerHTML=`<label>${esc(uname(id))} 새 비밀번호</label><input id="np" type="password" autocomplete="new-password" placeholder="4자 이상">
  <button class="btn gh" style="margin-top:8px" onclick="savePin(${id})">변경 저장</button>`;$('#np').focus();
}
async function savePin(id){
  try{await api('/api/users/'+id+'/pin',{pin:$('#np').value});$('#pinbox').innerHTML='';toast('비밀번호가 변경되었습니다')}
  catch(x){$('#mm').textContent=x.message}
}
async function delUser(b,id){
  if(b.dataset.sure!=='1'){b.dataset.sure='1';b.textContent='정말 삭제';return}
  try{await api('/api/users/'+id+'/delete',{});await load();showModal()}catch(x){$('#mm').textContent=x.message}
}
async function logout(){await api('/api/logout',{});if(es){es.close();es=null}modal=null;$('#app').innerHTML='';load()}
load();
</script>
</body>
</html>
